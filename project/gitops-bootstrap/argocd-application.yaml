apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamsite-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <repository-url>
    path: project/gitops
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
