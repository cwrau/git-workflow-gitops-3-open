name: Test und Lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      httpbin:
        image: mccutchen/go-httpbin:2.25.0
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - name: Cache Beispielverzeichnis
        uses: actions/cache@v4
        with:
          path: .cache
          key: teamsite-cache-${{ hashFiles('index.html') }}
      - name: HTML-Dateien auflisten
        run: find . -name "*.html" -print
      - name: Pruefen, ob Startseite existiert
        run: test -f index.html
      - name: Pruefen, ob Titel im HTML vorkommt
        run: grep -q "<title>" index.html
      - name: Service-Container erreichbar pruefen
        run: curl -sf http://localhost:8080/get

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Simulierte Bereitstellung nach Staging
        run: echo "Bereitstellung nach Staging simuliert fuer $(git rev-parse --short HEAD)"
